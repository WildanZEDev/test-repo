name: Build Endstone ARM64 Wheel

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-wheel:
    # Pake runner native ARM64 dari GitHub (gratis buat repo publik)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Tools & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools conan cmake ninja

      - name: Build Wheel Paket
        run: |
          python -m build --wheel

      - name: Upload Artifact (Hasil Wheel)
        uses: actions/upload-artifact@v4
        with:
          name: endstone-arm64-wheel
          path: dist/*.whl
          
