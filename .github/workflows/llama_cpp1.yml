name: Build llama.cpp for Termux Arm64 (Custom CPU Optimized)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout llama.cpp
        uses: actions/checkout@v4
        with:
          repository: 'ggml-org/llama.cpp'
          fetch-depth: 1

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Configure with CMake
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_OPENMP=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_C_FLAGS="-O3 -march=armv8.2-a+fp16+dotprod+crypto+crc" \
            -DCMAKE_CXX_FLAGS="-O3 -march=armv8.2-a+fp16+dotprod+crypto+crc"

      - name: Build llama-cli
        run: |
          cmake --build build --config Release --target llama-cli -j$(nproc)

      - name: Prepare Artifact
        run: |
          mkdir dist
          cp build/bin/llama-cli dist/
          chmod +x dist/llama-cli

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-termux-custom
          path: dist/llama-cli
          
